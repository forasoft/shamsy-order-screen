name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SESSION_SECRET: ci-only-secret-0123456789abcdef0123456789
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run db:reset
      - run: npm test
      - run: npm run build
      - name: Start the app
        run: npx next start -p 3100 & npx --yes wait-on http://localhost:3100/login
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run prove -- http://localhost:3100
